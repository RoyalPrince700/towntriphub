name: Keep Render Backend Alive

on:
  schedule:
    # Run every 8 minutes (GitHub scheduled workflows can be delayed under load)
    - cron: '*/8 * * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      # Optional: set a repo secret BACKEND_URL to override this.
      BACKEND_URL: "${{ secrets.BACKEND_URL || 'https://towntriphub.onrender.com/' }}"

    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging backend: ${BACKEND_URL}"
          echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Keep-alive should not fail the workflow. We still retry to reduce flakiness.
          curl --location \
            --silent --show-error \
            --max-time 25 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --write-out "\nHTTP %{http_code}\n" \
            --output /dev/null \
            "${BACKEND_URL}" || true

          echo "Ping attempt completed"
